spring:
  application:
    name: ppt-ai-backend
  
  # MySQL Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/ppt_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  
  # Mail Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  # Async Task Configuration
  task:
    execution:
      pool:
        core-size: 2
        max-size: 10
        queue-capacity: 100

# Server Configuration
server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars-long-for-security}
  expiration: 86400000
  refresh-expiration: 604800000

# AI API Configuration
ai:
  api:
    url: ${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
    key: ${AI_API_KEY:}
    model: ${AI_API_MODEL:deepseek-chat}

# Logging Configuration
logging:
  level:
    root: INFO
    com.pptai: DEBUG
    org.springframework.security: DEBUG
